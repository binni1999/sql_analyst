name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: datapilot
          POSTGRES_USER: postgres
          # CI-only: the GitHub runner is isolated and the database is not
          # exposed beyond the runner. Avoid credential drift between the
          # service container and Python setup/test processes.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d datapilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # CI database uses PostgreSQL trust auth; this avoids relying on a
      # password that can drift from the service-container configuration.
      DATABASE_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/datapilot
      LANGGRAPH_CHECKPOINT_DB_URL: postgresql://postgres@127.0.0.1:5432/datapilot
      REDIS_URL: redis://localhost:6379/0
      REDIS_CACHE_TTL_SECONDS: 300
      GROQ_API_KEY: ci-test-key
      OPENAI_API_KEY: ci-test-key
      GEMINI_API_KEY: ci-test-key
      TAVILY_API_KEY: ci-test-key
      HUGGINGFACEHUB_API_KEY: ci-test-key
      LANGSMITH_TRACING: "false"
      LOG_LEVEL: INFO
      LOG_FORMAT: json
      REQUEST_LOGGING: "false"
      ENVIRONMENT: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Verify test database connection
        env:
          PYTHONPATH: app
        run: |
          python - <<'PY'
          import os
          import psycopg2

          conn = psycopg2.connect(
              host="127.0.0.1",
              port=5432,
              dbname="datapilot",
              user="postgres",
          )
          conn.close()
          print("PostgreSQL connection verified")
          PY

      - name: Initialize test database
        env:
          PYTHONPATH: app
          DATABASE_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/datapilot
          LANGGRAPH_CHECKPOINT_DB_URL: postgresql://postgres@127.0.0.1:5432/datapilot
        run: |
          python -m database.create_schema_orm
          python -m database.insert_dummydata

      - name: Compile Python sources
        run: python -m compileall -q app

      - name: Run test suite
        env:
          PYTHONPATH: app
          DATABASE_URL: postgresql+psycopg2://postgres@127.0.0.1:5432/datapilot
          LANGGRAPH_CHECKPOINT_DB_URL: postgresql://postgres@127.0.0.1:5432/datapilot
        run: python -m pytest -q

  frontend-checks:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: multi-agent-data-analyst-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
